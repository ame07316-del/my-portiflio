name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push cancels the in-flight run of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # No real database in CI: the app falls back to the embedded PGlite
      # instance, which is exactly what `npm run dev` uses locally.
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint + typecheck
        run: npm run verify

      - name: Build
        run: npm run build
