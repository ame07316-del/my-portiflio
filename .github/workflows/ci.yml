name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · build + unit tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: node --test dist/tests/*.test.js
  server:
    name: Server · tests (embedded + real Postgres + load storm)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: sovereign }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MASTER_SECRET: ci-master-secret-must-be-at-least-32-chars
      IDEMPOTENCY_SECRET: ci-idempotency-secret-must-be-32chars
      ADMIN_SECRET: ci-admin-secret-must-be-at-least-32-char
      PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/sovereign
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: node --test dist/server/src/tests/*.test.js
      - name: Load storm (embedded engine)
        run: |
          SEED_DEMO=1 HTTP_PORT=8081 node dist/server/src/control-plane.js &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8081/healthz > /dev/null && break
            sleep 1
          done
          node scripts/load-test.mjs
          kill %1
  e2e:
    name: E2E · Playwright (Chromium)
    runs-on: ubuntu-latest
    needs: web
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: web/playwright-report/, retention-days: 7 }
  image:
    name: Docker · control-plane image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sovereign-control-plane:ci -f server/Dockerfile .
      - run: docker run --rm sovereign-control-plane:ci node --version
